name: build (Linux, macOS)

# Builds dist/Zoro-<os>-<arch>.tar.gz and checks that the frozen app starts.
# Run it from the Actions tab, or push a v* tag; the archives are uploaded as workflow artifacts.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller==6.11.1 certifi
      - run: python -I setup.py
      - run: python -I build.py
      - name: Smoke test
        run: |
          ./dist/Zoro/Zoro --no-browser --port 8765 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:8765/api/engines > engines.json && break; sleep 1; done
          cat engines.json
          python -c "import json; e = json.load(open('engines.json'))['engines']; assert len(e) == 11, e"
          curl -sf http://127.0.0.1:8765/ | grep -q '<title>Zoro'
          kill %1
      - uses: actions/upload-artifact@v4
        with:
          name: zoro-${{ runner.os }}
          path: dist/Zoro-*.tar.gz
